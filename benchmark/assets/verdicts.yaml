# paper/verdicts.yaml — 판정 단일 정본 (SSOT)
# 수정은 §1-2와 동급: 사용자 승인 커밋으로만. scripts/check_verdicts.py 가 이 파일을 읽어
# 원고(정본·파생본)의 판정 문구를 검사한다. PLAN-048 §0.8 문구 사전의 기계 정본.
#
# 라벨 정책 (§0.9 · 2026-08-15 개정 · 사용자 승인).
#   아래 verdicts 키(H3·H5·H2·T4·P0)는 **사전등록 라벨이며 record 는 불변이다.**
#   투고 파생본은 이 라벨을 본문에 쓰지 않고 서술형 호칭을 쓰므로(§0.9 규칙 2),
#   forbidden 패턴에 **서술형 변형을 함께 넣는다** — 라벨이 사라지면 라벨 기반 패턴이
#   파생본에서 눈이 멀기 때문이다. 즉 이 개정은 검사를 푼 것이 아니라 **좁아진 눈을 넓힌 것**이다.
#   파생본 호칭 ↔ 라벨 대응은 paper/supplementary/S6-preregistration-crosswalk.md 가 정본이다.

meta:
  plan: PLAN-048
  frozen_date: "2026-08-10"
  scan_targets:
    - paper/논문_v0_9_SDKB_통합초안.md
    - paper/submission/**/*.md
  # 헤더에 이 키워드가 있는 표는 통째로 면제한다. 두 표는 금지 문구와 경쟁 가설을
  # **나열하는 것이 임무**이므로(§0.4·§7.6 결론 규칙 표 · §7 경쟁 설명 분석표),
  # 검사기가 그 표의 내용을 위반으로 세면 표를 지우라는 요구가 된다.
  exempt_tables_with_header:
    - "금지되는 결론"
    - "가를 실험"

verdicts:
  H3:
    record:
      - { registration: PLAN-031, split: A, verdict: 부분지지 }
      - { registration: PLAN-047, split: B, verdict: 미지지 }
    composite_allowed:
      - "동시 충족은 두 분할에서 확인되지 않"
      - "깊은 회수.*(반복 관측|두 분할)"
    forbidden:
      - 'H3[는은]?\s*(전면\s*)?지지되'          # 합성으로 "지지" 단정 금지
      - '두 분할 모두.*부분\s*지지'              # A판정을 B에 전파 금지
      # 파생본 서술형 호칭 (§0.9 · 2026-08-15) — 라벨이 사라져도 금지는 남는다
      - '검색\s*유용성\s*점검[은는]?\s*(전면\s*)?지지되'
  H2:
    record:
      - { registration: v0.9, verdict: 미검정 }
      - { registration: PLAN-035, verdict: 기각(실검정 1회, 별도) }
    forbidden:
      - '게이트가.*안전(을|성을)\s*보장'
      - 'H2[는은]?\s*지지'
      # 파생본 서술형 호칭 (§0.9 · 2026-08-15)
      - '승인\s*안전성[은는]?\s*(확인|검증)됐'
  H5:
    record:
      - { registration: PLAN-031, split: A, verdict: 기각 }
      - { registration: PLAN-047, split: B, verdict: 재현되지 않음 }
    forbidden:
      - '동적\s*(태스크\s*)?결합의?\s*발견'      # PLAN-049 실측 전 승격 금지
      - '태스크\s*결합\(entanglement\)'          # 인과 표현 — "의존성"으로 완화(기존 결정)
  T4:
    record:
      - { registration: PLAN-047, verdict: 판정 1회 실패(미확증) }
    forbidden:
      - '전달되지\s*않는다'                      # 허용형: "전달을 확증하지 못했다"
      - 'RAG\s*성능'
    exempt_line:
      # §6.2f 교차언어 진단의 "전달"은 T4(검색→생성)가 아니라 B5 의 비교우위가 융합
      # 시스템으로 옮겨가는지의 이야기다 — 같은 낱말, 다른 층. 동음이의 오탐.
      - '교차언어|영어 정답|영어 회수|비교우위'
  P0:
    record:
      - { registration: PLAN-031/047, verdict: 양 분할 비유의 }
    forbidden:
      - '주\s*시스템.*유의(하|미)?\s*개선'
  SYSTEM_LABELS:             # 구성 명칭 (§0.8 확장 · 2026-08-13)
    # 사전 지정 **주 구성은 P0★ 하나**다. P1 을 "주 시스템"이라 부르면 §0.3 조건 ②
    # (주 구성에서 유의)와 §6 의 부차 구성 개선이 한 이름 아래 섞여, 비유의 판정이
    # 유의 개선으로 읽힌다. P1 은 **부차 구성**이고, EP3 에서 자원을 갈아 끼운 대상일
    # 때는 **교체 대상 구성**이라 쓴다.
    forbidden:
      - 'P1[^|]{0,24}주\s*시스템'          # P1 을 주 시스템이라 부르는 것
      - '사전\s*지정\s*주\s*시스템'          # P0★ 는 "사전 지정 주 **구성**"으로 통일
  SEAL:                      # 봉인 개봉 서술 (§0.3 조건 ⑤ · 2026-08-13)
    # 열람 원장이 5행인데 "1회 개봉"을 단독으로 단정하면 감사 기록과 어긋난다.
    # 금지하는 것은 **낱말이 아니라 무자격 단정**이다 — 같은 행에서 원장을 함께
    # 밝히면 허용한다(§0.3 조건명으로 쓰는 경우가 여기 해당).
    record:
      - { registration: PLAN-031/047, verdict: 열람 원장 5행 · 결과 산출 전 중단 2회 }
    composite_allowed:
      - '열람\s*원장'
    forbidden:
      - '1\s*회\s*개봉'
    exempt_line:
      - '(열람\s*)?원장'
  CLAIM_STRENGTH:            # 주장 강도 전역 규칙 (§0.3 · §0.8)
    forbidden:
      - '자원\s*지표는\s*태스크\s*성능을\s*대표하지\s*않는다(?!,?\s*그럴 수)'  # 무조건 일반형
      - '효과가?\s*확실'                          # §0.3 5조건 미충족(현재 2/5)
      - 'FTO\s*위험을\s*줄'
      - '(조사|검토)\s*시간.*%\s*절감'
  PLACEHOLDERS:              # 데스크 리젝 요인 (submission-check와 중복 방어)
    # 이 라벨만 마스킹을 우회한다(원문 검사): 플레이스홀더는 백틱 안에 적히는 것이
    # **정상 표기**라, 언급 면제를 적용하면 전량이 보이지 않게 된다.
    scan_raw: true
    forbidden:
      - '\[서지 재확인 필요\]'
      - '\[실험 후 기입\]'
      - '\[최종 릴리스 후 기입\]'
      - '\[미확정 서지\]'
