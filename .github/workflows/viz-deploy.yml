name: Build & Deploy Visualization Site

on:
  push:
    branches: [main]
    paths:
      - 'data/semiconductor_v0_3.json'
      - 'data/patents/raw/**'
      - 'data/reports/**'
      - 'ontology/sdkb-*.ttl'
      - 'scripts/build_viz.py'
      - 'pyproject.toml'
      - '.github/workflows/viz-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install SDKB with viz extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[viz]"

      - name: Rebuild SIRP / baseline parquet from sources
        run: |
          make parse
          make ingest-sirp
          make sirp-pairs

      - name: Build visualization site
        run: make viz

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
